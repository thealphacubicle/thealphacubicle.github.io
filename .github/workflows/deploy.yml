name: Lint, Build, and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (auto-fix)
        run: npm run lint

      - name: Commit lint fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add src/ && git commit -m "chore: apply eslint auto-fixes [skip ci]" && git push)

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Deploy to GitHub Pages
        run: |
          git add docs/
          git diff --staged --quiet || git commit -m "Deploy: update docs [skip ci]"
          git push
